version: "3.9"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  app : 
    build : .
    container_name:  klingelnberg-app
    restart: unless-stopped
    depends_on:
        - mongodb
    ports:
        - "8080:8080"
    environment:
        ASPNETCORE_ENVIRONMENT: Production
        MongoDbSettings__ConnectionString: mongodb://mongodb:27017
volumes:
  mongo_data:
